[package]
name = "pingap-location"
version.workspace = true
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/vicanso/pingap"
repository = "https://github.com/vicanso/pingap"
keywords = ["pingap", "location"]
description = "Reverse proxy location for pingap"
[lib]
name = "pingap_location"
path = "src/lib.rs"

[dependencies]
ahash = { workspace = true }
http = { workspace = true }
pingap-config = { workspace = true }
pingap-core = { workspace = true }
pingora = { workspace = true }
regex = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
tokio-test = "0.4.4"
bytesize = { workspace = true }
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"
