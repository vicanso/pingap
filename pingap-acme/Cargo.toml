[package]
name = "pingap-acme"
version.workspace = true
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/vicanso/pingap"
repository = "https://github.com/vicanso/pingap"
keywords = ["pingap", "acme"]
description = "ACME client for pingap"


[lib]
name = "pingap_acme"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
hickory-resolver = { workspace = true }
hmac = { workspace = true }
instant-acme = { workspace = true }
nanoid = { workspace = true }
pingap-certificate = { workspace = true }
pingap-config = { workspace = true }
pingap-core = { workspace = true }
pingora = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
scopeguard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
substring = { workspace = true }
psl = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }


[features]
# TLS backend, mirrored from the workspace root: exactly one must be on.
default = ["openssl"]
openssl = ["pingora/openssl", "pingap-certificate/openssl"]
tls-rustls = ["pingora/rustls", "pingap-certificate/tls-rustls"]

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"
