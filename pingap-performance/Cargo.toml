[package]
name = "pingap-performance"
version.workspace = true
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/vicanso/pingap"
repository = "https://github.com/vicanso/pingap"
keywords = ["pingap", "performance"]
description = "Performance metrics for pingap"


[lib]
name = "pingap_performance"
path = "src/lib.rs"

[features]
# TLS backend, mirrored from the workspace root: exactly one must be on.
default = ["openssl"]
openssl = ["pingora/openssl", "pingap-upstream/openssl"]
tls-rustls = ["pingora/rustls", "pingap-upstream/tls-rustls"]
tracing = [
    "dep:prometheus",
    "dep:reqwest",
    "dep:url",
    "dep:humantime",
    "dep:http",
    "dep:snafu",
    "pingap-cache/tracing",
]

[dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytesize = { workspace = true }
cfg-if = { workspace = true }
# Only used by `prom.rs`, which is behind the `tracing` feature.
humantime = { workspace = true, optional = true }
http = { workspace = true, optional = true }
memory-stats = { workspace = true }
num_cpus = { workspace = true }
pingap-cache = { workspace = true }
pingap-core = { workspace = true }
pingap-location = { workspace = true }
pingap-upstream = { workspace = true }
pingora = { workspace = true }
prometheus = { workspace = true, features = ["protobuf"], optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
snafu = { workspace = true, optional = true }
sysinfo = { workspace = true }
tracing = { workspace = true }
url = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
procfs = { workspace = true }


[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-test = { workspace = true }

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"
