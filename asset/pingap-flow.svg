  <circle class="dot fc" r="4.5" opacity="0"><animateMotion dur="4.5s" begin="3.75s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3;1"><mpath xlink:href="#c1"/></animateMotion><animate attributeName="opacity" dur="4.5s" begin="3.75s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.27;0.3;1"/></circle>
