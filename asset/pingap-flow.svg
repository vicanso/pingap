  <circle class="dot fa" r="4.5" opacity="0"><animateMotion dur="4.5s" begin="2.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4;0.72;1"><mpath xlink:href="#ua"/></animateMotion><animate attributeName="opacity" dur="4.5s" begin="2.25s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4;0.43;0.69;0.72;1"/></circle>
