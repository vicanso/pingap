<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Requests from the internet pass through Pingap, which routes them by host and path to groups of upstream servers">
  <title>Requests from the internet pass through Pingap, which routes them by host and path to groups of upstream servers</title>
  <!-- Shown in the README. Animated with SMIL and CSS only, no script; the colours follow
       prefers-color-scheme, and prefers-reduced-motion stops the motion. -->

  <style>
    svg {
      --bg: #ffffff; --panel: #f6f8fa; --line: #d1d9e0; --text: #1f2328;
      --muted: #59636e; --hub: #fff4e8; --hub-line: #f97316; --hi: #ffe2c2;
      --a: #2563eb; --b: #0d9488; --c: #7c3aed; --ok: #22c55e;
      --req: #2563eb; --res: #16a34a; --alt: #ea580c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
        "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3;
        --muted: #9198a1; --hub: #24180d; --hub-line: #fb923c; --hi: #4a2e12;
        --a: #60a5fa; --b: #2dd4bf; --c: #a78bfa; --ok: #4ade80;
        --req: #60a5fa; --res: #4ade80; --alt: #fb923c;
      }
    }
    .bg { fill: var(--bg); stroke: var(--line); }
    .node { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
    .hub { fill: var(--hub); stroke: var(--hub-line); stroke-width: 1.6; }
    .row { fill: var(--bg); stroke: var(--line); }
    .t { fill: var(--text); font-size: 13px; }
    .title { fill: var(--text); font-size: 15px; font-weight: 600; }
    .big { fill: var(--text); font-size: 19px; font-weight: 700; }
    .m { fill: var(--muted); font-size: 12px; }
    .cap { fill: var(--muted); font-size: 11px; letter-spacing: 1.2px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .wire { fill: none; stroke: var(--line); stroke-width: 1.6; }
    .flow { fill: none; stroke-width: 1.6; stroke-dasharray: 5 7; animation: dash 1.2s linear infinite; }
    .sa { stroke: var(--a); } .sb { stroke: var(--b); } .sc { stroke: var(--c); }
    .fa { fill: var(--a); } .fb { fill: var(--b); } .fc { fill: var(--c); }
    .ok { fill: var(--ok); animation: beat 2.4s ease-in-out infinite; }
    .pill { fill: var(--bg); stroke-width: 1.2; }
    .f-hub { fill: var(--hub-line); }
    .f-req { fill: var(--req); } .f-res { fill: var(--res); } .f-alt { fill: var(--alt); }
    .s-req { stroke: var(--req); } .s-res { stroke: var(--res); } .s-alt { stroke: var(--alt); }
    .s-line { stroke: var(--line); }
    .seg { fill: none; stroke-width: 1.8; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes scan { 0%, 60%, 100% { fill: var(--bg); } 20% { fill: var(--hi); } }
    @keyframes glow-req { 0%, 14%, 100% { stroke: var(--line); stroke-width: 1.2; } 4% { stroke: var(--req); stroke-width: 2.4; } }
    @keyframes glow-res { 0%, 14%, 100% { stroke: var(--line); stroke-width: 1.2; } 4% { stroke: var(--res); stroke-width: 2.4; } }
    .scan { animation: scan .75s linear infinite; }
    .greq { animation: glow-req 6s linear infinite; }
    .gres { animation: glow-res 6s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .dot { display: none; }
      .flow, .ok, .scan, .greq, .gres { animation: none; }
    }
  </style>
