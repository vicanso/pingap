name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/build-website.sh"
      - "pingap-*/README.md"
      - "pingap-plugin/docs/**"
      - "docs/**"
      - "docs/zh/**"
      - "examples/README.md"
      - "README.md"
      - "README_zh.md"
      - "asset/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Assemble documentation content
        run: |
          chmod +x scripts/build-website.sh
          ./scripts/build-website.sh
          mkdir -p website/public
          if [ ! -f website/public/logo.png ]; then
            cp asset/pingap-logo.png website/public/logo.png 2>/dev/null \
              || cp icons/pingap-256.png website/public/logo.png
          fi

      - name: Install and build VitePress
        working-directory: website
        env:
          # Custom domain (pingap.io) → "/". Project pages → "/pingap/"
          DOCS_BASE: "/"
        run: |
          npm ci
          npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
