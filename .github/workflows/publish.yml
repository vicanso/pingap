name: "publish"
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    # branches: []

# Release toolchain: a pinned recent stable, deliberately newer than the
# workspace MSRV. test.yml proves the MSRV; this file only has to produce
# good binaries. The two `toolchain:` pins below and the builder image in
# the Dockerfile are one setting - move them together.
env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: vicanso/pingap

# Only the jobs that publish release assets get write access, and only their
# upload steps get the token. The built-in token instead of a personal access
# token: it cannot expire, and an expired PAT is indistinguishable from an
# empty release list in the upload script. Nothing here triggers on `release`,
# so the built-in token not raising workflow events costs us nothing.
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - name: build-web
        run: make build-web
      # dtolnay's action makes the pinned toolchain the rustup default. The
      # archived actions-rs/toolchain it replaces only installed it: the
      # runner's preinstalled stable stayed active, and the `rustup update`
      # that used to follow moved that to whatever was newest on release
      # day - v0.13.10's macOS binaries were built with 1.98.0 while the pin
      # said 1.88.0.
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Install protobuf
        run: brew install protobuf
      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rustc --version
          cargo build --release --target=aarch64-apple-darwin
          mv target/aarch64-apple-darwin/release/pingap ./pingap-darwin-aarch64
          tar -czvf pingap-darwin-aarch64.tar.gz pingap-darwin-aarch64

          cargo build --release --target=aarch64-apple-darwin --features=full
          mv target/aarch64-apple-darwin/release/pingap ./pingap-darwin-aarch64-full
          tar -czvf pingap-darwin-aarch64-full.tar.gz pingap-darwin-aarch64-full

          cargo build --release --target=x86_64-apple-darwin
          mv target/x86_64-apple-darwin/release/pingap ./pingap-darwin-x86
          tar -czvf pingap-darwin-x86.tar.gz pingap-darwin-x86

          cargo build --release --target=x86_64-apple-darwin --features=full
          mv target/x86_64-apple-darwin/release/pingap ./pingap-darwin-x86-full
          tar -czvf pingap-darwin-x86-full.tar.gz pingap-darwin-x86-full

          ls -lh pingap*.gz

          ./.github/workflows/upload_asset.sh ./pingap-darwin-aarch64.tar.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./pingap-darwin-aarch64-full.tar.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./pingap-darwin-x86.tar.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./pingap-darwin-x86-full.tar.gz $GITHUB_TOKEN

  linux-musl-x86:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - name: build-web
        run: make build-web
      - name: release
        # The checkout belongs to the runner user and the build runs as root,
        # so without safe.directory vergen cannot read the commit sha.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/home/rust/src" \
            messense/rust-musl-cross:x86_64-musl sh -ec '
            apt-get update
            apt-get install protobuf-compiler -y
            printf "[safe]\n\tdirectory = *\n" >> ~/.gitconfig
            make release-full
            mv target/x86_64-unknown-linux-musl/release/pingap ./pingap-linux-musl-x86-full
            make release-rustls-full
            mv target/x86_64-unknown-linux-musl/release/pingap ./pingap-linux-musl-x86-rustls-full
            # The default build comes last: cargo-deb picks the binary up from
            # the target directory in the next step, so it is copied, not moved.
            make release
            cp target/x86_64-unknown-linux-musl/release/pingap ./pingap-linux-musl-x86
          '
      # Best effort: a broken deb must not cost the release its tarballs, which
      # are what the install instructions actually point at. The upload step
      # skips the file when this did not produce one.
      - name: Build deb
        continue-on-error: true
        run: |
          # The build above ran as root inside the container, so everything it
          # wrote to target/ is root owned and cargo-deb cannot create or clear
          # its staging directory underneath.
          sudo chown -R "$(id -u):$(id -g)" target
          cargo install cargo-deb --locked
          # --no-build because the musl binary already exists from the container
          # step above, and --no-strip because the release profile strips it and
          # the host toolchain cannot strip a foreign binary anyway.
          cargo deb --target x86_64-unknown-linux-musl --no-build --no-strip \
            --output ./pingap-linux-x86.deb
      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czvf pingap-linux-musl-x86.tar.gz pingap-linux-musl-x86
          tar -czvf pingap-linux-musl-x86-full.tar.gz pingap-linux-musl-x86-full
          tar -czvf pingap-linux-musl-x86-rustls-full.tar.gz pingap-linux-musl-x86-rustls-full

          ls -lh pingap*.gz

          ./.github/workflows/upload_asset.sh ./pingap-linux-musl-x86.tar.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./pingap-linux-musl-x86-full.tar.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./pingap-linux-musl-x86-rustls-full.tar.gz $GITHUB_TOKEN

          # Absent when the deb step failed, which is allowed to happen.
          if [ -f ./pingap-linux-x86.deb ]; then
            ls -lh ./pingap-linux-x86.deb
            ./.github/workflows/upload_asset.sh ./pingap-linux-x86.deb $GITHUB_TOKEN
          else
            echo "no deb produced, skipping"
          fi

  linux-musl-aarch64:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - name: build-web
        run: make build-web
      - name: release
        # The checkout belongs to the runner user and the build runs as root,
        # so without safe.directory vergen cannot read the commit sha.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/home/rust/src" \
            messense/rust-musl-cross:aarch64-musl sh -ec '
            apt-get update
            apt-get install protobuf-compiler -y
            printf "[safe]\n\tdirectory = *\n" >> ~/.gitconfig
            make release-full
            mv target/aarch64-unknown-linux-musl/release/pingap ./pingap-linux-musl-aarch64-full
            make release-rustls-full
            mv target/aarch64-unknown-linux-musl/release/pingap ./pingap-linux-musl-aarch64-rustls-full
            # The default build comes last: cargo-deb picks the binary up from
            # the target directory in the next step, so it is copied, not moved.
            make release
            cp target/aarch64-unknown-linux-musl/release/pingap ./pingap-linux-musl-aarch64
          '
      # Best effort: a broken deb must not cost the release its tarballs, which
      # are what the install instructions actually point at. The upload step
      # skips the file when this did not produce one.
      - name: Build deb
        continue-on-error: true
        run: |
          # The build above ran as root inside the container, so everything it
          # wrote to target/ is root owned and cargo-deb cannot create or clear
          # its staging directory underneath.
          sudo chown -R "$(id -u):$(id -g)" target
          cargo install cargo-deb --locked
          # --no-build because the musl binary already exists from the container
          # step above, and --no-strip because the release profile strips it and
          # the host toolchain cannot strip a foreign binary anyway.
          cargo deb --target aarch64-unknown-linux-musl --no-build --no-strip \
            --output ./pingap-linux-aarch64.deb
      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czvf pingap-linux-musl-aarch64.tar.gz pingap-linux-musl-aarch64
          tar -czvf pingap-linux-musl-aarch64-full.tar.gz pingap-linux-musl-aarch64-full
          tar -czvf pingap-linux-musl-aarch64-rustls-full.tar.gz pingap-linux-musl-aarch64-rustls-full

          ls -lh pingap*.gz

          ./.github/workflows/upload_asset.sh ./pingap-linux-musl-aarch64.tar.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./pingap-linux-musl-aarch64-full.tar.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./pingap-linux-musl-aarch64-rustls-full.tar.gz $GITHUB_TOKEN

          # Absent when the deb step failed, which is allowed to happen.
          if [ -f ./pingap-linux-aarch64.deb ]; then
            ls -lh ./pingap-linux-aarch64.deb
            ./.github/workflows/upload_asset.sh ./pingap-linux-aarch64.deb $GITHUB_TOKEN
          else
            echo "no deb produced, skipping"
          fi

  linux-gnu:
    timeout-minutes: 3600
    runs-on: ${{ matrix.platform.runs-on }}
    permissions:
      contents: write # create the release and upload assets
    strategy:
      matrix:
        platform:
          - { tag: "x86", runs-on: "ubuntu-22.04" }
          - { tag: "aarch64", runs-on: "ubuntu-22.04-arm" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - name: build-web
        run: make build-web
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake libclang-dev wget gnupg ca-certificates lsb-release --no-install-recommends protobuf-compiler
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - name: Run cargo release
        run: |
          rustc --version
          make release-all
          ldd target/release/pingap
          mv target/release/pingap ./pingap-linux-gnu-${{ matrix.platform.tag }}
          mv target/release/pingap-full ./pingap-linux-gnu-${{ matrix.platform.tag }}-full
          make release-rustls-full
          ldd target/release/pingap
          mv target/release/pingap ./pingap-linux-gnu-${{ matrix.platform.tag }}-rustls-full
      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czvf pingap-linux-gnu-${{ matrix.platform.tag }}.tar.gz ./pingap-linux-gnu-${{ matrix.platform.tag }}
          tar -czvf pingap-linux-gnu-${{ matrix.platform.tag }}-full.tar.gz ./pingap-linux-gnu-${{ matrix.platform.tag }}-full
          tar -czvf pingap-linux-gnu-${{ matrix.platform.tag }}-rustls-full.tar.gz ./pingap-linux-gnu-${{ matrix.platform.tag }}-rustls-full

          ls -lh pingap*.gz

          ./.github/workflows/upload_asset.sh ./pingap-linux-gnu-${{ matrix.platform.tag }}.tar.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./pingap-linux-gnu-${{ matrix.platform.tag }}-full.tar.gz $GITHUB_TOKEN
          ./.github/workflows/upload_asset.sh ./pingap-linux-gnu-${{ matrix.platform.tag }}-rustls-full.tar.gz $GITHUB_TOKEN

  windows:
    # Temporarily disabled
    if: false
    permissions:
      contents: write # create the release and upload assets
    runs-on: windows-latest
    name: ${{ matrix.target }}
    env:
      CFG_RELEASE_CHANNEL: ${{ matrix.cfg_release_channel }}
    strategy:
      # https://help.github.com/en/actions/getting-started-with-github-actions/about-github-actions#usage-limits
      # There's a limit of 60 concurrent jobs across all repos in the rust-lang organization.
      # In order to prevent overusing too much of that 60 limit, we throttle the
      # number of rustfmt jobs that will run concurrently.
      matrix:
        target: [x86_64-pc-windows-msvc]

    steps:
      # The Windows runners have autocrlf enabled by default
      # which causes failures for some of rustfmt's line-ending sensitive tests
      - name: disable git eol translation
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      - name: build-web
        run: make build-web

        # Run build
      - name: Install Rustup using win.rustup.rs
        run: |
          # Disable the download progress bar which can cause perf issues
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest https://win.rustup.rs/ -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-host=x86_64-pc-windows-msvc --default-toolchain=none
          del rustup-init.exe
          rustup target add ${{ matrix.target }}
        shell: powershell

      - name: Add mingw64 to path for x86_64-gnu
        run: echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
        if: matrix.target == 'x86_64-pc-windows-gnu' && matrix.channel == 'nightly'
        shell: bash

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0

      - name: Set Perl environment variables
        if: runner.os == 'Windows'
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run cargo release
        shell: bash
        run: |
          cargo --version
          cargo build --release --features=full
          mv target/release/pingap.exe ./pingap-windows.exe
      - name: Zip
        shell: powershell
        run: |
          Compress-Archive -Path pingap-windows.exe -Destination pingap-windows.exe.zip
      - name: Upload asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ./.github/workflows/upload_asset.sh ./pingap-windows.exe.zip $GITHUB_TOKEN

  docker:
    timeout-minutes: 3600
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      matrix:
        platform:
          - { arch: "linux/amd64", tag: "amd64", runs-on: "ubuntu-22.04" }
          - { arch: "linux/arm64", tag: "arm64", runs-on: "ubuntu-22.04-arm" }
        features: ['latest', 'full', 'rustls-full']
    steps:
      - name: Free disk space
        run: |
          df -k /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          # One per command: apt-get rejects a list with any unknown name.
          for pkg in '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' \
            '^mysql-.*' azure-cli google-chrome-stable firefox powershell mono-devel \
            libgl1-mesa-dri google-cloud-sdk google-cloud-cli; do
            sudo apt-get remove -y --fix-missing "$pkg" || true
          done
          sudo apt-get autoremove -y || true
          sudo apt-get clean
          sudo docker image prune --all --force || true
          df -k /
      - name: Change Swap Space
        run: |
          set -euo pipefail
          swapon --show
          df -lh

          # The runner image boots with /swapfile already active, and
          # fallocate refuses to resize a file that is in use as swap
          # ("fallocate failed: Text file busy"). Turn the swap areas off and
          # delete the file before allocating the bigger one.
          export SWAP_FILE=/swapfile
          sudo swapoff -a
          sudo rm -f $SWAP_FILE
          sudo fallocate -l 24G $SWAP_FILE
          sudo chmod 600 $SWAP_FILE
          sudo mkswap $SWAP_FILE
          sudo swapon $SWAP_FILE
      - name: Swap space report after modification
        shell: bash
        run: |
          echo "Memory and swap:"
          free -h
          echo
          swapon --show
          df -lh
          echo
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set build args
        shell: bash
        id: build_args
        run: |
          # `latest` is the plain default build. `rustls-full` is not a cargo
          # feature name: it swaps the TLS backend, which needs the default
          # `openssl` feature turned off.
          case "${{ matrix.features }}" in
            latest) ;;
            rustls-full)
              echo "BUILD_ARGS=--no-default-features --features=tls-rustls,full" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "BUILD_ARGS=--features=${{ matrix.features }}" >> $GITHUB_OUTPUT
              ;;
          esac
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform.arch }}
          build-args: |
            BUILD_ARGS=${{ steps.build_args.outputs.BUILD_ARGS }}
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.platform.tag }}-${{ matrix.features }}
          push: true
      # Same build args as above, so the cargo build is a cache hit.
      - name: Build and push distroless
        id: docker_build_distroless
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: distroless
          platforms: ${{ matrix.platform.arch }}
          build-args: |
            BUILD_ARGS=${{ steps.build_args.outputs.BUILD_ARGS }}
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.platform.tag }}-${{ matrix.features }}-distroless
          push: true
      - name: Image digest
        run: |
          echo "default: ${{ steps.docker_build.outputs.digest }}"
          echo "distroless: ${{ steps.docker_build_distroless.outputs.digest }}"
  merge:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        features: ['latest', 'full', 'rustls-full']
    needs: [docker] # 等待所有架构构建完成
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Extract version from Git tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Create and push multi-arch manifest
        run: |
          if [ "${{ matrix.features }}" = "latest" ]; then
            TAGS="-t ${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
            DISTROLESS_TAGS="-t ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-distroless"
          else
            TAGS="-t ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ matrix.features }}"
            DISTROLESS_TAGS="-t ${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ matrix.features }}-distroless"
          fi
          docker buildx imagetools create \
            $TAGS \
            ${{ env.IMAGE_NAME }}:amd64-${{ matrix.features }} \
            ${{ env.IMAGE_NAME }}:arm64-${{ matrix.features }}
          docker buildx imagetools create \
            $DISTROLESS_TAGS \
            ${{ env.IMAGE_NAME }}:amd64-${{ matrix.features }}-distroless \
            ${{ env.IMAGE_NAME }}:arm64-${{ matrix.features }}-distroless
