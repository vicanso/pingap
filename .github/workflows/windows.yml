name: "windows"
on:
  # Every change of the code is compiled for Windows (`cargo check`): no
  # other workflow does, the Windows jobs of test.yml and publish.yml are
  # switched off, and what only breaks there was found at release time.
  # A change that is documentation alone has nothing to compile.
  push:
    # tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    branches: [main, windows]
    paths-ignore: ["**.md", "docs/**", "website/**", "asset/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "website/**", "asset/**"]
  # The release build, which takes about twice as long: by hand for any
  # branch (`gh workflow run windows.yml --ref <branch>`), and for a push
  # to the `windows` branch.
  workflow_dispatch:

# One run per ref: a newer push takes the place of the one before it.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    name: ${{ matrix.target }}
    env:
      CFG_RELEASE_CHANNEL: ${{ matrix.cfg_release_channel }}
    strategy:
      # https://help.github.com/en/actions/getting-started-with-github-actions/about-github-actions#usage-limits
      # There's a limit of 60 concurrent jobs across all repos in the rust-lang organization.
      # In order to prevent overusing too much of that 60 limit, we throttle the
      # number of rustfmt jobs that will run concurrently.
      # One target. There used to be a second leg named
      # x86_64-pc-windows-gnu, but the build below names no target, so
      # both legs built for the host, which is msvc: the same thing twice.
      matrix:
        target: [x86_64-pc-windows-msvc]

    steps:
      # The Windows runners have autocrlf enabled by default
      # which causes failures for some of rustfmt's line-ending sensitive tests
      - name: disable git eol translation
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
      - name: build-web
        run: make build-web

        # Run build
      - name: Install Rustup using win.rustup.rs
        run: |
          # Disable the download progress bar which can cause perf issues
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest https://win.rustup.rs/ -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-host=x86_64-pc-windows-msvc --default-toolchain=none
          del rustup-init.exe
          rustup target add ${{ matrix.target }}
        shell: powershell

      - name: Add mingw64 to path for x86_64-gnu
        run: echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
        if: matrix.target == 'x86_64-pc-windows-gnu' && matrix.channel == 'nightly'
        shell: bash

      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - name: Set Perl environment variables
        if: runner.os == 'Windows'
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run cargo check
        if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/windows'
        shell: bash
        run: |
          cargo --version
          cargo check --features=full

      - name: Run cargo release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/windows'
        shell: bash
        run: |
          cargo --version
          cargo build --release --features=full
