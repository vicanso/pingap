<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pingap Documentation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Pingap — high-performance reverse proxy powered by Cloudflare Pingora." />
    <meta http-equiv="refresh" content="0; url=en/" />
    <link rel="canonical" href="en/" />
    <link rel="icon" href="assets/logo.png" />
    <script>
      (function () {
        var target = "en/";
        try {
          var lang = new URLSearchParams(location.search).get("lang");
          if (lang === "zh") target = "zh/";
          else if (lang === "en") target = "en/";
        } catch (e) {}
        // Preserve hash routes when possible (e.g. #/plugins/jwt)
        var hash = location.hash || "";
        location.replace(target + hash);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f7faf8;
        color: #24312b;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
      }
      a {
        color: #0b6e4f;
      }
    </style>
  </head>
  <body>
    <p>
      Redirecting to
      <a href="en/">English docs</a>…
      <a href="zh/">中文文档</a>
    </p>
  </body>
</html>
