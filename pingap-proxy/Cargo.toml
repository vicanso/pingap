[package]
name = "pingap-proxy"
version.workspace = true
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/vicanso/pingap"
repository = "https://github.com/vicanso/pingap"
keywords = ["pingap", "proxy"]
description = "Proxy for pingap"


[dependencies]
ahash = { workspace = true }
async-trait = { workspace = true }
bstr = { workspace = true }
bytes = { workspace = true }
cfg-if = { workspace = true }
http = { workspace = true }
humantime = { workspace = true, optional = true }
itoa = { workspace = true }
num_cpus = { workspace = true }
pingap-acme = { workspace = true }
pingap-certificate = { workspace = true }
pingap-config = { workspace = true }
pingap-core = { workspace = true }
pingap-location = { workspace = true }
pingap-logger = { workspace = true }
pingap-otel = { workspace = true, optional = true }
pingap-performance = { workspace = true }
pingap-upstream = { workspace = true }
pingap-util = { workspace = true }
pingora = { workspace = true }
scopeguard = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
criterion = { workspace = true }

[features]
# TLS backend, mirrored from the workspace root: exactly one must be on.
default = ["openssl"]
openssl = [
    "pingora/openssl",
    "pingap-acme/openssl",
    "pingap-certificate/openssl",
    "pingap-performance/openssl",
    "pingap-upstream/openssl",
]
tls-rustls = [
    "pingora/rustls",
    "pingap-acme/tls-rustls",
    "pingap-certificate/tls-rustls",
    "pingap-performance/tls-rustls",
    "pingap-upstream/tls-rustls",
]
tracing = [
    "pingap-otel",
    "humantime",
    "pingap-core/tracing",
    "pingap-performance/tracing",
]
