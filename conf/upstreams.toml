###
# Upstream Config
###
[upstreams.charts]
# Upstream address list
# Format: "address:port [weight]"
# weight is optional, default is 1
# Example: "127.0.0.1:5000" has weight 1
#          "127.0.0.1:5001 10" has weight 10
addrs = ["127.0.0.1:5000", "127.0.0.1:5001 10"]

# Service discovery, support "dns", "srv", "docker", "static", "transparent".
# With "srv" each of `addrs` is a name whose SRV records give the hosts, their
# ports and their weights, e.g. "_http._tcp.api.service.consul".
# Default `none`
# discovery = ""

# How often to refresh the list of upstream servers when using service discovery.
# Format: duration string (e.g. "1m", "30s", "1h").
# Used when discovery is `dns`, `srv` or `docker`. Default `1m`
# update_frequency = "1m"


# Loadbalancer selection algorithm
# Supported algorithms:
# - "hash:url" - Consistent hashing based on request URL
# - "hash:ip" - Consistent hashing based on request IP
# - "hash:header:header_name" - Consistent hashing based on specified header
# - "hash:cookie:cookie_name" - Consistent hashing based on specified cookie
# - "hash:query:query_name" - Consistent hashing based on specified query
# - "hash" - Consistent hashing based on request path
# - "round_robin" - Simple round robin distribution
# - "least_conn" - The backend with the fewest requests in flight for its
#   weight; backends that are level take turns
# - "sticky:cookie_name" - A client stays on the backend it was given first,
#   by a cookie of this name that the proxy sets itself
# Default `round_robin`
# algo = "hash:cookie:sid"

# Send a request to a backend all the same when none of them is healthy (by
# the health check, or held back by the circuit breaker) instead of answering
# 503. Default `false`
# fail_open = true

# Server Name Indication (SNI) for HTTPS upstream connections. 
# Specify the hostname to be used in the TLS handshake when connecting to upstream HTTPS servers.
# Example: "example.com"
# It should be set if the upstream server is https. Default `none`
# `$host` asks the upstream for the host the client asked this proxy for.
# sni = ""

# Whether to check if upstream' server cert is valid and validated
# Default `true`
# verify_cert = true

# Upstream http health check, if not set, tcp health check will be used.
# - http: `http://upstreamname/path?connection_timeout=3s&read_timeout=3s&check_frequency=10s&success=1&failure=2&reuse=true`
# - tcp: `tcp://upstreamname?connection_timeout=3s&read_timeout=3s&check_frequency=10s&success=1&failure=2&reuse=true`
# - websocket: `ws://upstreamname/path?connection_timeout=3s&read_timeout=3s` (or `wss://`),
#   an upgrade handshake that must be answered with 101 and a valid Sec-WebSocket-Accept
# - grpc: `grpc://upstreamname/path?connection_timeout=3s&read_timeout=3s&check_frequency=10s&success=1&failure=2&reuse=true&tls=true&service=pingap`
# The default parameters are:
# - connection_timeout: 3s
# - read_timeout: 3s
# - check_frequency: 10s
# - success: 1
# - failure: 2
# - reuse: false
# - tls: false
# health_check = "http://charts/ping?connection_timeout=3s&read_timeout=3s"

# When set to true, forces upstream connections to only use IPv4 addresses,
# ignoring any IPv6 addresses even if available. Useful for environments
# where IPv6 connectivity is problematic or not supported. 
# Default `false`
# ipv4_only = false

# Enable distributed tracing for upstream connections. When enabled, the connected connection will be traced.
# Default `false`
# enable_tracer = false

# Application-Layer Protocol Negotiation (ALPN) protocol for upstream connections.
# Supported values: "h1" (HTTP/1.1), "h2" (HTTP/2), "h2h1" (HTTP/2 over TLS with HTTP/1.1 fallback).
# This setting determines which protocol version to use when communicating with upstream servers.
# Default `h1`
# alpn = "h1"

# Maximum number of concurrent HTTP/2 streams per upstream connection:
# - Only takes effect when the upstream negotiates HTTP/2 (`alpn = "h2"` or
#   `"h2h1"`, including cleartext h2c).
# - Enables practical HTTP/2 multiplexing (gRPC, Connect RPC, h2c backends,
#   long-lived streaming) instead of one active stream per connection.
# - Must be greater than 0.
# - Default: 1 (Pingora default, one stream per connection)
# max_h2_streams = 100

# Request header policy towards this upstream. The defaults are what RFC 9110
# asks of a proxy and are right for almost every backend; each key exists as
# an escape hatch for an upstream that depends on the old passthrough
# behaviour. Setting all four as shown restores it completely.
#
# Strip the standard hop-by-hop request headers (Connection, Keep-Alive,
# Proxy-Connection, Proxy-Authenticate, Proxy-Authorization, TE, Trailer,
# Transfer-Encoding, Upgrade, HTTP2-Settings).
# Default `true`
# strip_hop_by_hop = false
#
# Strip the extension headers named in the downstream `Connection` header.
# While on, a request whose Connection nominates Host, an X-Forwarded-*
# header or a pseudo-header is rejected rather than forwarded.
# Default `true`
# strip_connection_nominated = false
#
# Reject Connection nominations that are not a valid HTTP token (e.g. a
# quoted name). Only has an effect while strip_connection_nominated is on.
# Default `true`
# reject_malformed_connection_nominations = false
#
# HTTP/1 Upgrade handshakes:
# - "websocket_only": forward a valid WebSocket upgrade in normalized form,
#   drop every other Upgrade
# - "preserve": forward any Upgrade request with its headers untouched -
#   needed for Docker attach/exec, h2c and other non-WebSocket protocols
# - "deny": forward none
# Default `websocket_only`
# h1_upgrade = "preserve"
#
# CA certificate(s) used to verify this upstream's certificate instead of
# the system trust store: a PEM file path, base64-encoded PEM or raw PEM,
# holding one or more certificates. Lets a private or self-signed backend
# keep verify_cert enabled. Only matters when the upstream uses TLS.
# Default `none` (system trust store)
# ca = "/opt/pingap/conf/upstream-ca.pem"
#
# The certificate presented to an upstream that asks its clients for one
# (mutual TLS), and its private key: each a PEM file path, base64-encoded
# PEM or raw PEM. Set both or neither. An https health check presents the
# certificate too. Default `none`
# client_cert = "/opt/pingap/conf/upstream-client.pem"
# client_key = "/opt/pingap/conf/upstream-client.key"
#
# HTTP/2 flow-control window advertised per stream to this upstream, between
# 1 and 2GiB - 1 (RFC 9113). Larger windows help big responses on
# high-latency links.
# Default `8mib` (pingora default)
# h2_stream_window_size = "8mib"
#
# HTTP/2 connection-level flow-control window advertised to this upstream,
# shared by every stream on the connection, between 1 and 2GiB - 1.
# Default `8mib` (pingora default)
# h2_connection_window_size = "8mib"

# How long to wait before giving up establishing a TCP connection
# Default `none`
# connection_timeout = "10s"

# How long to wait before giving up establishing a connection including TLS handshake time
# Default `none`
# total_connection_timeout = "30s"

# How long to wait before each individual `read()` from upstream. The timer is reset after each `read()`
# Default `none`
# read_timeout = "10s"

# How long to wait before closing a idle connection waiting for connection reuse
# Default `1m`
# idle_timeout = "1m"

# How long to wait before a `write()` to upstream finishes
# Default `none`
# write_timeout = "10s"

# TCP keepalive idle time:
# - Duration a connection must be idle before TCP starts sending keepalive probes
# - Helps detect dead peer connections while minimizing unnecessary network traffic
# - Default: none (system default)
# tcp_idle = "2m"

# TCP keepalive probe interval:
# - Time between consecutive keepalive probe attempts
# - Lower values detect connection failures faster but increase network overhead
# - Default: none (system default)
# tcp_interval = "1m"

# TCP keepalive probe count:
# - Maximum number of failed probes before declaring connection dead
# - Higher values increase tolerance to temporary network issues
# - Lower values detect failures faster but may cause premature disconnections
# - Default: none (system default)
# tcp_probe_count = 9

# TCP receive buffer size:
# - Size of the kernel buffer for receiving TCP packets
# - Larger values can improve throughput for high-bandwidth connections
# - Smaller values conserve memory but may impact performance
# - Default: none (system default)
# tcp_recv_buf = "4kb"

# TCP Fast Open:
# - Enables TCP Fast Open (TFO) protocol for faster connection establishment
# - Reduces latency by sending data in the initial SYN packet
# - Requires kernel support and may not work with all clients/networks
# - Default: none (system default)
# tcp_fast_open = true

# For `dns` and `srv` discovery: the resolvers to ask, separated by commas, each an
# IP address with an optional port.
# Default `none` (the resolver of the system)
# dns_server = "10.0.0.53:53"

# For `dns` and `srv` discovery: the domain added to a name that is not qualified.
# dns_domain = "svc.cluster.local"

# For `dns` and `srv` discovery: the search list for a name that is not qualified.
# dns_search = "default.svc.cluster.local"

# TCP_USER_TIMEOUT of the connections to the backends (Linux): how long data
# that was sent may stay unacknowledged before the connection is closed.
# Default `none`
# tcp_user_timeout = "1m"

# Count the responses of each backend. Needed for the circuit breaker below.
# Default `false`
# enable_backend_stats = true

# The statuses that count as a failure of the backend, separated by commas.
# A connection that could not be made always counts.
# Default `none` (every 5xx)
# backend_failure_status_code = "500,502,503,504"

# The window the requests and failures of a backend are counted over.
# At least `1ms`. Default `1m`
# backend_stats_interval = "1m"

# Open the circuit breaker of a backend after this many failures in a row.
# Default `0` (the rule is off)
# circuit_break_max_consecutive_failures = 5

# Open it when this share of the requests in the window failed, 0 to 100.
# Default `0` (the rule is off)
# circuit_break_max_failure_percent = 50

# The share only counts once the window holds this many requests.
# Default `10`
# circuit_break_min_requests_threshold = 10

# How long an open breaker keeps the backend out before it lets probes through.
# Default `10s`
# circuit_break_open_duration = "10s"

# How many probes have to succeed in a row to close the breaker again.
# Default `5`
# circuit_break_half_open_consecutive_success_threshold = 5

# Names of storage entries whose settings are put into this upstream.
# Default `none`
# includes = ["commonUpstream"]

# Description of this upstream
# remark = ""


[upstreams.diving]
addrs = ["127.0.0.1:5001"]
