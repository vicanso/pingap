###
# Basic config
###
[basic]
# Specify the application instance name, which is used to easily identify the application when sending notifications. Default `pingap`
# name = "pingap"

# Error response templates, which can be configured as HTML or JSON. The following characters in the template will be replaced.
# {{version}} - the version of the application
# {{error_type}} - the type of the error
# {{content}} - the message for the client: the reason of a 4xx pingap raised,
#   otherwise only the status text. The error itself goes to the log.
# Default `the content of error.html`
# error_template = ""

# Process id file. Default `/run/pingap.pid`
# pid_file = "/run/pingap.pid"

# File the daemon redirects its stderr to, only used together with `--daemon`.
# Without it the daemonized process keeps the stderr it inherited: the spawning
# terminal for a manual start, or the parent's stderr for a process spawned by
# an auto restart. Set this to keep panics and the startup errors that happen
# before the logger is initialized. Default `none`
# error_log = "/var/log/pingap_error.log"

# Unix socket path used for application upgrades. Default `/tmp/pingap_upgrade.sock`
# upgrade_sock = "/tmp/pingap_upgrade.sock"
# Working directory the daemon switches to after forking, only with `--daemon`.
# Default `none` (pingora's default)
# working_directory = "/var/lib/pingap"
# How long `--autorestart` waits for the replacement process to report that it
# is ready to take over the listening sockets. The report arrives over
# `<upgrade_sock>.ready` right before the new process asks for the sockets; only
# then does the current process send itself SIGQUIT. If the replacement exits,
# its daemon dies, or this much time passes first, the restart is abandoned and
# the current process keeps serving. Default `1m`
# restart_ready_timeout = "1m"

# After daemonization, this process will switch to the given user before starting to serve traffic. Default `none`
# user = ""

# Similar to `user`, the group this process should switch to. Default `none`
# group = ""

# Set the number of threads per server. If set to 0, it will match the CPU core count. Default `1`
# threads = 1

# Upper bound of each worker runtime's blocking thread pool, which serves
# spawn_blocking work such as file cache I/O. Default `512` (tokio default)
# max_blocking_threads = 512

# Allow work stealing between threads of the same service. Default `true`.
# work_stealing = true
# Downstream TLS handshake offload. Set both to run TLS handshakes on dedicated
# thread pools instead of the worker threads, sharded by connection: the number
# of pools, and the threads in each. A handshake-heavy TLS endpoint - many
# short connections, little session resumption - stops stalling request
# processing this way. Both are required together and must be greater than 0;
# leave both unset to keep handshaking on the workers (pingora's default).
# Default `none`
# downstream_tls_offload_threadpools = 2
# downstream_tls_offload_thread_per_pool = 4
# Upstream connect offload: the same idea for establishing upstream connections
# (TCP connect and TLS handshake), which otherwise run on the worker threads.
# Set both to move them onto dedicated pools; the wait for a pool thread shows
# up in the access log as {:upstream_connect_offload_wait_time}. Both are
# required together and must be greater than 0.
# Default `none`
# upstream_connect_offload_threadpools = 2
# upstream_connect_offload_thread_per_pool = 4

# Grace period before starting the final step of the graceful shutdown after signaling shutdown. Default `5m`
# grace_period = "5m"

# Timeout in seconds of the final step for the graceful shutdown. Default `5s`
# graceful_shutdown_timeout = "5s"

# Keepalive pool size for client connections to upstream. Default `128`
# upstream_keepalive_pool_size = 128

# HTTP webhook URL for notifications, default `none`
# webhook = "https://example.com/webhook"

# Webhook type, supports 'wecom', 'dingtalk' and 'normal' types. Default `none`
# webhook_type = "wecom"

# Available events: "backend_status" (upstream backend status changes), "lets_encrypt" (Let's Encrypt certificate operations),
# "diff_config" (configuration changes), "restart" (application restarts), "restart_fail" (application restart fails),
# "reload_config" (configuration reloads), "reload_config_fail" (configuration reload fails), "tls_validity" (TLS certificate validity changes),
# "service_discover_fail" (service discovery failures). Default `none`
# webhook_notifications = ["backend_status"]

# Notifications no more than this far apart are merged into one webhook post;
# each one extends the wait. `0s` posts every notification on its own. Default `10s`
# webhook_batch_window = "10s"

# A batch is posted as soon as it holds this many notifications. `1` posts every
# notification on its own. Default `5`
# webhook_batch_max_events = 5

# Notifications below this level are not sent: "info", "warn" or "error". Default `info`
# webhook_min_level = "warn"

# Headers of the webhook request, each "Name: value". Default `none`
# webhook_headers = ["Authorization: Bearer token"]

# What a post is signed with: the secret of a dingtalk robot with signing on, or,
# for a receiver of your own, the key of the `X-Pingap-Signature` of the body. Default `none`
# webhook_secret = "SECxxxx"

# The text of the message in place of the built-in one: the markdown of a wecom or
# dingtalk message, the whole JSON body for any other type. `{{title}}`, `{{message}}`,
# `{{level}}`, `{{category}}`, `{{hostname}}`, `{{ip}}`, `{{name}}` and `{{count}}` are
# filled in. Default `none`
# webhook_template = "**{{title}}**\n\n{{message}}"

# How many times a post that failed is sent again, at most 10. Default `0`
# webhook_retries = 2

# Set log level for application. 
# Available levels: "debug", "info", "warn", "error"
# Default `None`
# log_level = "info"

# Specifies how much log data to buffer in memory before writing to disk.
# Larger buffer size can improve performance but uses more memory and may lose some logs if the application crashes.
# Default `None`
# log_buffered_size = "10MB"

# Enable json log format. Default `false`
# log_format_json = false

# Sentry connection URI for error tracking and monitoring.
# Enable this to track errors and exceptions in your application.
# It's available in the full feature release. Default `none`
# sentry = ""

# Pyroscope is a continuous profiling platform that helps you understand performance
# bottlenecks in your application. When configured, it will collect and analyze CPU profiles.
# Example value: "http://pyroscope:4040"
# It's available in the full feature release. Default `none`
# pyroscope = ""

# This setting controls how often Pingap checks for configuration file changes.
# When changes are detected, the process will automatically restart to apply the new configuration.
# At least `1s`. Default `90s`
# auto_restart_check_interval = "90s"

# The cache is set up per `cache` plugin, with its `directory` option: a
# path for a file cache, `memory://?max_size=100mb` for the memory cache.
# There is no cache setting here.

# The addresses of the proxies in front of pingap, as IPs or CIDRs.
# When set, `X-Forwarded-For` and `X-Real-IP` are only taken from a
# connection that comes from one of them. The plugins that decide by the
# client's address (`ip_restriction`, `limit` by ip, the admin's lock) go by
# the address of the connection unless it is one of these.
# Default `none`
# trusted_proxies = ["10.0.0.0/8", "192.168.1.10"]

# How many tasks accept connections on each listening socket.
# Default `1`
# listener_tasks_per_fd = 1

# Compress the rotated files of the logs that go to a file: "gzip" or "zstd".
# Default `none` (not compressed)
# log_compress_algorithm = "zstd"

# The compression level, up to 9 for gzip and 22 for zstd.
# Default `9`
# log_compress_level = 9

# Compress a rotated file once it has not been modified for this many days;
# the original is removed afterwards.
# Default `7`
# log_compress_days_ago = 7

# The hour of the day, 0 to 23, at which the compression runs.
# Default `0`
# log_compress_time_point_hour = 0
