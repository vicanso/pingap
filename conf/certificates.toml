###
# Certificate Config
###

# [certificates.acmeNpmtrend]
# Domain names this certificate is valid for (comma separated)
# domains = "npmtrend.com,charts.npmtrend.com"

# ACME configuration for automated certificate management
# acme = "lets_encrypt"


# [certificates.pingap]
# tls certificate content, it can be a file path or pem base64 encoded, or pem raw content
# tls_cert = "~/certs/pingap.io.pem"

# tls certificate private key, it can be a file path or pem base64 encoded, or pem raw content
# tls_key = "~/certs/pingap.io.key"


# Whether this is the default certificate for SNI. Default `false`
# is_default = true

# Whether this is a CA certificate: with its key, a certificate is issued for
# each server name on demand. Default `false`
# is_ca = false

# For a certificate with `acme`: answer the DNS-01 challenge instead of
# HTTP-01. Needed for wildcard domains. Default `false`
# dns_challenge = true

# The DNS provider the DNS-01 challenge is answered through:
# "ali", "cf", "huawei", "tencent" or "manual"
# dns_provider = "cf"

# The endpoint and credentials of the DNS provider. The value of a query
# parameter, or the whole of it, written `$ENV:NAME` is read from the
# environment. (Any text value of the configuration can be written
# `$ENV:NAME` or `$FILE:/path` as a whole.)
# dns_service_url = "https://api.cloudflare.com?token=$ENV:CF_TOKEN"

# With `acme`: renew the certificate this many days before it expires
# (default `14`, or a third of what the certificate lasts when that is less).
# Without: warn this many days before it expires (default `7`).
# buffer_days = 14

# With `acme`: the ACME server the certificate is ordered from, when that is
# not Let's Encrypt's production environment: another CA, Let's Encrypt's
# staging environment, a CA of your own.
# acme_directory = "https://acme-staging-v02.api.letsencrypt.org/directory"

# A PEM file with the root the ACME server's own certificate is verified
# with, for a CA of your own. Default: the roots of the system.
# acme_ca = "/etc/pingap/internal-root.pem"

# External account binding, for a CA that asks for one: the key id and its
# HMAC key (base64, as the CA gives it), set together.
# acme_eab_kid = "$ENV:EAB_KID"
# acme_eab_hmac = "$ENV:EAB_HMAC"

# The e-mail addresses of the ACME account, comma separated.
# acme_contact = "ops@example.com"

# The key of the certificate: "ecdsa" (P-256) or "rsa" (2048 bits).
# Default `ecdsa`
# acme_key_type = "rsa"

# Description of this certificate
# remark = ""
