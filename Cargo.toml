    "aes",
    "alloc",
] }
ahash = "0.8.12"
arc-swap = "1.9.2"
async-trait = "0.1.91"
base64 = "0.23.0"
bytes = "1.12.1"
bytesize = { version = "2.4.2", features = ["serde"] }
bollard = "0.21.0"
bstr = "1.12.1"
dashmap = "6.2.1"
cfg-if = "1.0.4"
chrono = { version = "0.4.45", default-features = false, features = [
    "std",
    "clock",
] }
cookie = "0.18.1"
crc32fast = "1.5.0"
ctor = "1.0.11"
derive_more = { version = "2.1.1", default-features = false, features = [
    "debug",
] }
diff = "0.1.13"
dirs = "6.0.0"
etcd-client = "0.19.0"
fancy-regex = "0.18.0"
flate2 = "1.1.9"
futures = "0.3.33"
futures-util = "0.3.33"
glob = "0.3.4"
hex = "0.4.3"
hickory-resolver = "0.26.1"
http = "1.4.2"
hmac = "0.13.0"
hmac-sha256 = "1.1.14"
hmac-sha512 = { version = "1.1.12", default-features = false }
hostname = "0.4.2"
humantime = "2.4.0"
humantime-serde = "1.1.1"
instant-acme = "0.8.5"
ipnet = "2.12.0"
itoa = "1.0.18"
jsonwebtoken = "9.3.1"
local-ip-address = "0.6.13"
memory-stats = { version = "1.2.0", features = ["always_use_statm"] }
mime_guess = "2.0.5"
nanoid = "0.5.0"
num_cpus = "1.17.0"
opentelemetry = { version = "0.32.0", default-features = false, features = [
    "trace",
] }
opentelemetry-http = { version = "0.32.0", default-features = false }
opentelemetry-jaeger-propagator = { version = "0.32.0" }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
    "grpc-tonic",
    "trace",
] }
opentelemetry_sdk = { version = "0.32.1", features = [
    "rt-tokio",
], default-features = false }
path-absolutize = "4.0.1"
pingap-acme = { version = "0.13.4", path = "pingap-acme" }
pingap-cache = { version = "0.13.4", path = "pingap-cache" }
pingap-certificate = { version = "0.13.4", path = "pingap-certificate" }
pingap-config = { version = "0.13.4", path = "pingap-config" }
pingap-core = { version = "0.13.4", path = "pingap-core" }
pingap-discovery = { version = "0.13.4", path = "pingap-discovery" }
pingap-health = { version = "0.13.4", path = "pingap-health" }
pingap-imageoptim = { version = "0.13.4", path = "pingap-imageoptim" }
pingap-location = { version = "0.13.4", path = "pingap-location" }
pingap-logger = { version = "0.13.4", path = "pingap-logger" }
pingap-otel = { version = "0.13.4", path = "pingap-otel" }
pingap-performance = { version = "0.13.4", path = "pingap-performance" }
pingap-plugin = { version = "0.13.4", path = "pingap-plugin" }
pingap-proxy = { version = "0.13.4", path = "pingap-proxy" }
pingap-pyroscope = { version = "0.13.4", path = "pingap-pyroscope" }
pingap-sentry = { version = "0.13.4", path = "pingap-sentry" }
pingap-upstream = { version = "0.13.4", path = "pingap-upstream" }
pingap-util = { version = "0.13.4", path = "pingap-util" }
pingap-webhook = { version = "0.13.4", path = "pingap-webhook" }
pingora = { version = "0.8.1", default-features = false, features = [
    "lb",
    "openssl",
    "cache",
] }
pingora-limits = "0.8.1"
pingora-runtime = "0.8.1"
pem = "3.0.6"
# Replaces tldextract, whose idna 0.2 dependency carries RUSTSEC-2024-0421;
# the public suffix list is compiled in, no runtime fetching.
psl = "2.1.223"
prometheus = { version = "0.14.0", default-features = false }
rand = "0.10.2"
rcgen = { version = "0.14.8", features = ["pem", "x509-parser"] }
regex = { version = "1.13.1", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = [
    "query",
    "json",
    "default-tls",
] }
rustls = "0.23.40"
rustls-pki-types = "1.15.1"
rustc_version_runtime = "0.3.0"
scopeguard = "1.2.0"
sentry-core = { version = "0.36.0", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
serde_qs = "1.1.2"
smallvec = "1.13.2"
snafu = { version = "0.9.2", features = ["std"], default-features = false }
sha1 = "0.11.0"
sha2 = { version = "0.11.0", default-features = false }
strum = { version = "0.28.0", features = ["derive"] }
substring = "1.4.5"
# 0.38.4 is the last version supporting rustc 1.88 (0.39.0 jumped to 1.95);
# do not bump past it without bumping the workspace MSRV.
sysinfo = { version = "0.38.4", features = [
    "system",
], default-features = false }
tempfile = "3.27.0"
time = { version = "0.3.54", features = ["local-offset"] }
TinyUFO = "0.8.1"
tokio = { version = "1.53.1", default-features = false, features = ["fs"] }
toml = "1.1.3"
hcl-rs = "0.19"
# 6.5.0 is the last version supporting rustc 1.88 (6.6.0 jumped to 1.95);
# do not bump past it without bumping the workspace MSRV.
kdl = "6.5.0"
tonic = "0.14.6"
tonic-health = "0.14.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
# `tracing-log` is one of the crate's default features, so it has to be listed
# back explicitly here. Without it the fmt layers render every record bridged
# from the `log` crate with the target `log`, hiding which dependency emitted it.
tracing-subscriber = { version = "0.3.23", features = [
    "local-time",
    "json",
    "fmt",
    "ansi",
    "env-filter",
    "tracing-log",
], default-features = false }
