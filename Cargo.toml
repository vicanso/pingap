[package]
name = "pingap"
version.workspace = true
authors = ["Tree Xie <tree.xie@outlook.com>"]
edition = "2024"
categories = ["network-programming", "web-programming::http-server"]
keywords = ["proxy", "http", "gateway"]
description = "A reverse proxy like nginx"
license = "Apache-2.0"
homepage = "https://github.com/vicanso/pingap"
repository = "https://github.com/vicanso/pingap"
exclude = ["asset/*", "test/*", "Cargo.lock", "web/*", ".github/*", "docs/*"]
readme = "./README.md"
rust-version = "1.88"
default-run = "pingap"
build = "build.rs"

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
cfg-if = { workspace = true }
clap = { version = "4.6.4", features = [
    "derive",
    "std",
    "help",
    "usage",
], default-features = false }
ctor = { workspace = true }
crossbeam-channel = "0.5.16"
flate2 = { workspace = true }
glob = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
humantime = { workspace = true }
humantime-serde = { workspace = true }
nanoid = { workspace = true }
nix = { version = "0.31.3", features = ["signal"] }
pingap-acme = { workspace = true }
pingap-cache = { workspace = true }
pingap-certificate = { workspace = true }
pingap-config = { workspace = true }
pingap-core = { workspace = true }
pingap-imageoptim = { workspace = true, optional = true }
pingap-location = { workspace = true }
pingap-logger = { workspace = true }
pingap-otel = { workspace = true, optional = true }
pingap-performance = { workspace = true }
pingap-plugin = { workspace = true }
pingap-proxy = { workspace = true }
pingap-pyroscope = { workspace = true, optional = true }
pingap-sentry = { workspace = true, optional = true }
pingap-upstream = { workspace = true }
pingap-util = { workspace = true }
pingap-webhook = { workspace = true }
pingora = { workspace = true }
regex = { workspace = true }
rust-embed = { version = "8.12.0", features = [
    "mime-guess",
    "compression",
], default-features = false }
serde_qs = { workspace = true }
sysinfo = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
substring = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
kdl = { workspace = true }

[build-dependencies]
vergen = { version = "9.1.0", features = ["build"] }
vergen-git2 = "9.1.0"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.47"

[features]
pyro = ["pingap-pyroscope"]
imageoptim = ["pingap-imageoptim"]
geo = ["pingap-plugin/geo"]
tracing = [
    "pingora/sentry",
    "pingap-cache/tracing",
    "pingap-core/tracing",
    "pingap-performance/tracing",
    "pingap-proxy/tracing",
    "pingap-otel",
    "pingap-sentry",
]
full = ["tracing", "imageoptim"]
perf = ["pyro", "full"]
default = []


[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
pretty_assertions = "1.4.1"
tokio-test = "0.4.4"
tempfile = { workspace = true }


[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[profile.release-perf]
inherits = "release"
debug = 1
strip = "none"


[[bench]]
name = "bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["humantime-serde", "hcl-rs", "kdl"]

# Debian packaging (cargo-deb). The paths below are not a fresh choice: they are
# the ones pingap.service has always used, so the unit works as installed.
#
# Built from the musl targets in publish.yml, which link statically - hence
# `depends` is empty rather than `$auto`. `$auto` would run dpkg-shlibdeps and
# tie the package to the glibc of whichever runner built it.
[package.metadata.deb]
maintainer = "Tree Xie <tree.xie@outlook.com>"
copyright = "2024-2026, Tree Xie <tree.xie@outlook.com>"
license-file = ["LICENSE", "0"]
extended-description = """\
Pingap is a reverse proxy built on Cloudflare Pingora, configured through TOML, \
HCL or KDL and manageable from a built-in web admin panel. It supports dynamic \
upstreams, health checks, ACME certificates and a plugin chain for auth, \
caching, rate limiting and traffic splitting."""
section = "net"
priority = "optional"
# Statically linked, so nothing to resolve at install time.
depends = ""
assets = [
    ["target/release/pingap", "usr/sbin/pingap", "755"],
    # The one config file that is canonical in every layout pingap supports, so
    # dropping it here cannot trigger the startup layout migration. Everything
    # in /etc is registered as a conffile, so an edited copy survives upgrades.
    ["conf/basic.toml", "etc/pingap/conf/basic.toml", "644"],
    ["README.md", "usr/share/doc/pingap/README.md", "644"],
    # Reference material, deliberately outside /etc: these use the one file per
    # category layout, which would collide with the `?separation` layout the
    # unit asks for if they were loaded as live config.
    ["conf/servers.toml", "usr/share/doc/pingap/examples/servers.toml", "644"],
    ["conf/locations.toml", "usr/share/doc/pingap/examples/locations.toml", "644"],
    ["conf/upstreams.toml", "usr/share/doc/pingap/examples/upstreams.toml", "644"],
    ["conf/plugins.toml", "usr/share/doc/pingap/examples/plugins.toml", "644"],
    ["conf/certificates.toml", "usr/share/doc/pingap/examples/certificates.toml", "644"],
]
# cargo-deb writes the generated systemd maintainer scripts here. Without this
# key it installs the unit but emits no postinst/postrm at all, so nothing runs
# `systemctl daemon-reload` and `purge` leaves the unit registered.
maintainer-scripts = "packaging/debian"

# `unit-scripts = "."` because pingap.service lives at the repo root and is the
# file the docs point at. Installed but neither enabled nor started: the shipped
# config defines no server, so doing either here would only produce a failed
# unit. `systemctl enable --now pingap` once there is something to serve.
[package.metadata.deb.systemd-units]
unit-name = "pingap"
unit-scripts = "."
enable = false
start = false

[workspace]
members = [
    "pingap-acme",
    "pingap-cache",
    "pingap-certificate",
    "pingap-config",
    "pingap-core",
    "pingap-discovery",
    "pingap-health",
    "pingap-imageoptim",
    "pingap-location",
    "pingap-logger",
    "pingap-otel",
    "pingap-performance",
    "pingap-plugin",
    "pingap-proxy",
    "pingap-pyroscope",
    "pingap-sentry",
    "pingap-upstream",
    "pingap-util",
    "pingap-webhook",
]
[workspace.package]
version = "0.13.8"

[workspace.dependencies]
