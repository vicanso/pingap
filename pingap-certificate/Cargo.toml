[package]
name = "pingap-certificate"
version.workspace = true
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/vicanso/pingap"
repository = "https://github.com/vicanso/pingap"
keywords = ["pingap", "certificate"]
description = "Certificate for pingap"

[lib]
name = "pingap_certificate"
path = "src/lib.rs"

[dependencies]
ahash = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
pingap-config = { workspace = true }
pingap-core = { workspace = true }
pingap-util = { workspace = true }
pingora = { workspace = true }
rcgen = { workspace = true }
regex = { workspace = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
serde = { workspace = true }
snafu = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
x509-parser = { workspace = true }


[features]
# TLS backend, mirrored from the workspace root: exactly one must be on.
default = ["openssl"]
openssl = ["pingora/openssl"]
tls-rustls = ["pingora/rustls", "dep:rustls", "dep:rustls-pki-types"]

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
nanoid = { workspace = true }

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"
