[package]
name = "pingap-imageoptim"
version.workspace = true
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/vicanso/pingap"
repository = "https://github.com/vicanso/pingap"
keywords = ["pingap", "imageoptim"]
description = "ImageOptim for pingap"


[lib]
name = "pingap_imageoptim"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
bytemuck = { workspace = true }
bytes = { workspace = true }
ctor = { workspace = true }
http = { workspace = true }
# Only the four formats this crate actually handles. `image`'s defaults enable
# sixteen, and the unused `exr` decoder was dragging in pulp -> paste
# (RUSTSEC-2024-0436) along with ten other codecs nothing here calls.
image = { workspace = true }
imagequant = { workspace = true }
lodepng = { workspace = true }
mozjpeg = { workspace = true }
pingap-config = { workspace = true }
pingap-core = { workspace = true }
pingap-plugin = { workspace = true }
pingora = { workspace = true }
rgb = { workspace = true }
snafu = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
criterion = { workspace = true }
toml = { workspace = true }

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"
