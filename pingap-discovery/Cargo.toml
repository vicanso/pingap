[package]
name = "pingap-discovery"
version.workspace = true
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
license = "Apache-2.0"
homepage = "https://github.com/vicanso/pingap"
repository = "https://github.com/vicanso/pingap"
keywords = ["pingap", "discovery"]
description = "Discovery for pingap"

[lib]
name = "pingap_discovery"
path = "src/lib.rs"


[dependencies]
async-trait = { workspace = true }
bollard = { workspace = true }
futures = { workspace = true }
hickory-resolver = { workspace = true }
http = { workspace = true }
pingap-core = { workspace = true }
pingora = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }

[lints.clippy]
# Set the unwrap_used lint level to deny
unwrap_used = "deny"
